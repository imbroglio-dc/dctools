# Written by `biostat-trust apply` (biostat plugin). Edit the plugin's template, then rerun biostat-trust apply.
name: ownership
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
  pull-requests: read
# No concurrency group: every run on a head is its own required suite, a cancelled one blocks merging, and parallel runs are harmless because each reads live state.
jobs:
  ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/workflows
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pyyaml==6.0.1
      - name: ownership
        env:
          GH_TOKEN: ${{ github.token }}
          TRUST_CONFIG: ${{ github.workspace }}/.github/workflows/trust/trust.yaml
          TRUST_REPO_ROOT: ${{ github.workspace }}
        run: python -I -X pycache_prefix="$RUNNER_TEMP/pyc" -c 'import sys; sys.path.append(".github/workflows/trust"); from trustlib import ownership_check; sys.exit(ownership_check.main())'
