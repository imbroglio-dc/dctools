# DIAGNOSTIC BRANCH ONLY (never merge): find the test during which the ubuntu
# runner receives a shutdown signal, by streaming each test's location.
on:
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  diagnose:
    runs-on: ubuntu-latest
    name: ubuntu-latest (release, diagnose)
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::pkgload
          needs: check

      - name: Memory and processes before
        run: free -m; ps -eo pid,pgid,comm | head -40

      - name: Tests, streamed by location
        run: |
          ( while true; do echo "[mem] $(free -m | awk '/Mem:/ {print $3"/"$2" MB"}')"; sleep 10; done ) &
          Rscript -e 'pkgload::load_all("."); testthat::test_dir("tests/testthat", reporter = testthat::LocationReporter$new(), stop_on_failure = FALSE, load_package = "none")'

      - name: Memory and processes after
        if: always()
        run: free -m; ps -eo pid,pgid,comm | head -40
