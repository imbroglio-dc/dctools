# Written by `biostat-trust apply` (biostat plugin). Edit the plugin's template, then rerun biostat-trust apply.
# GitHub requires every `ownership` run on the head to pass, so a review reruns the head's runs; this job is named
# `ownership` too, so a review whose reruns fail leaves the PR blocked instead of on a stale verdict (fails closed).
name: ownership-review
on:
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  actions: write
  contents: read
concurrency:
  group: ownership-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  ownership:
    name: ownership
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/workflows
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: rerun-ownership
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I -X pycache_prefix="$RUNNER_TEMP/pyc" -c 'import sys; sys.path.append(".github/workflows/trust"); from trustlib import rerun; sys.exit(rerun.main())'
